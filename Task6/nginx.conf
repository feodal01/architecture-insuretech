http {
    # Объявляем зону лимитирования:
    #  - $binary_remote_addr — ключ (IP-адрес клиента)
    #  - zone=limit_zone:10m — используем 10 Мб памяти под хранение данных о лимитах
    #  - rate=10r/m — максимально 10 запросов в минуту
    limit_req_zone $binary_remote_addr zone=limit_zone:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применяем ранее объявленную зону лимитирования
            limit_req zone=limit_zone;
            # Задаём, какой код ошибки возвращать при превышении лимита
            limit_req_status 429;

            proxy_pass http://backend_servers;
        }
    }
}
