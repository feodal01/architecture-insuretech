# ==========================
# 1. Типы данных (Entities)
# ==========================

type Client {
  id: ID!
  name: String
  age: Int

  "Связанные документы клиента (паспорт, права и т.п.)"
  documents: [Document]

  "Список родственников клиента"
  relatives: [Relative]
}

type Document {
  id: ID!
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

type Relative {
  id: ID!
  relationType: String
  name: String
  age: Int
}

# ==========================
# 2. Запросы (Queries)
# ==========================

type Query {

  """
  Возвращает информацию о клиенте (id, name, age)
  и, при необходимости, связанный список документов и родственников.
  Аналог /clients/{id} + /documents + /relatives в REST.
  """
  client(id: ID!): Client
  clientDocuments(clientId: ID!): [Document]
  clientRelatives(clientId: ID!): [Relative]
}



